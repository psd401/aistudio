name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # reusable's claude-code-action OIDC exchange; caller must grant (org default is read-only)
    # Dependabot cannot grant id-token: write to the reusable (startup_failure).
    # Keyed on the PR author, not github.actor: a maintainer reopening or
    # pushing to a Dependabot PR is the actor, but the PR is still Dependabot's.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
  # Dependabot PRs aren't reviewed, but production repos require a
  # `claude-review / claude-review` check, and the skipped job above reports
  # only `claude-review`. This job has the same name and calls a no-op
  # reusable, so the required context passes (PSD401/.github#27).
  claude-review-dependabot:
    name: claude-review
    permissions: {}
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review-skip.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
