name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [dev]
  schedule:
    - cron: "0 8 * * 1"
jobs:
  openwiki:
    permissions:
      # The reusable mints a down-scoped psd-automation App token for writes;
      # GITHUB_TOKEN is only used by checkout.
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@main
    with:
      base_branch: dev
    secrets: inherit
