name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore:
      - "openwiki/**"
  schedule:
    - cron: "0 8 * * 1"
jobs:
  openwiki:
    permissions:
      # The current reusable declares these scopes, so the caller must grant
      # them even though repository writes use a down-scoped App token.
      contents: write
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
    with:
      base_branch: dev
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
