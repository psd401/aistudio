name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore:
      - "openwiki/**"
  schedule:
    - cron: "0 8 * * 1"
jobs:
  openwiki:
    permissions:
      # The current reusable declares these scopes, so the caller must grant
      # them even though repository writes use a down-scoped App token.
      contents: write
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@main
    with:
      base_branch: dev
    secrets: inherit
