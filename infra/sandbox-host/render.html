<!doctype html>
<!--
  Atrium artifact sandbox host page (#1052, Epic #1059, Phase 2, spec §19.2 / §28.1)

  Served from the DEDICATED sandbox origin (ATRIUM_SANDBOX_ORIGIN) — a distinct
  CloudFront distribution / subdomain that shares NO cookies or storage with the
  AI Studio app origin. The app embeds this page in an
  <iframe sandbox="allow-scripts"> (NO allow-same-origin) and posts the untrusted
  artifact code to it via postMessage AFTER load.

  Containment layers (defense in depth):
   1. Cross-origin: this page is never same-origin with the app, so even if the
      sandbox attributes were bypassed it could not read app cookies/storage.
   2. iframe sandbox without allow-same-origin: the framed document runs in an
      opaque origin — it cannot read THIS origin's cookies/storage either, and
      cannot reach the app origin.
   3. CSP: CloudFront serves this page with a strict Content-Security-Policy
      (default-src 'none'; connect-src 'none'; ...), so artifact code cannot call
      first-party APIs or exfiltrate over the network except to explicitly
      allowlisted CDNs. The <meta> CSP below is a same-value fallback for local
      preview; the authoritative CSP is the response header.
   4. Parent-origin allowlist: this page only accepts a render message whose
      event.origin is in the build-time ALLOWED_PARENT_ORIGINS list, so a random
      site cannot frame it and inject code (it would also be blocked by the host
      CSP `frame-ancestors`, but we check defensively).

  The injected artifact may include inline <script> tags; setting innerHTML does
  not execute them, so we recreate each <script> node (allowed by the host CSP's
  script-src 'unsafe-inline'). Those nodes are recreated ONE AT A TIME in
  document order, each external/module script is awaited before the next node
  runs, and a synthetic DOMContentLoaded + load is fired once after the last one
  (#1785 — see executeScripts). We render only ONE message (the first valid one
  is replaced on each subsequent valid message) and never eval arbitrary strings
  ourselves beyond reconstructing the author's own script nodes.

  Before any artifact code runs, this host installs window.AtriumData. The helper
  uses postMessage to ask the authenticated parent for scoped data operations;
  it does not weaken the frame CSP or give artifact code direct network access.

  AtriumData exposes three operations, and which ones an artifact may actually
  use is decided by the PARENT from the object's stored data_access mode, never
  here: submit/list (the artifact record store) and query (#1705, viewer-scoped
  read-only PSD data). `query` runs as the person VIEWING the page — this frame
  never sees a token, only SQL in and rows out — and it is mutually exclusive
  with submit/list so a page can never read district data and then write it into
  a store its author can read back.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Fallback CSP for environments that don't set the response header (e.g. local
      file preview). CloudFront sets the authoritative, identical policy as a
      response header in production. The CSP token in the meta below is
      substituted at deploy time by the CDK stack.
    -->
    <meta http-equiv="Content-Security-Policy" content="__CSP_POLICY__" />
    <title>Artifact</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; }
      #atrium-artifact-root { padding: 0; }
      #atrium-artifact-empty {
        display: flex; align-items: center; justify-content: center;
        min-height: 200px; color: #9ca3af; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="atrium-artifact-root">
      <div id="atrium-artifact-empty">Waiting for artifact…</div>
    </div>
    <script>
      (function () {
        "use strict";

        // Build-time substitution: the JSON array of app origins allowed to post
        // render messages to this host. The CDK stack replaces this token.
        var ALLOWED_PARENT_ORIGINS = __ALLOWED_PARENT_ORIGINS__;

        var root = document.getElementById("atrium-artifact-root");

        function isAllowedOrigin(origin) {
          if (!Array.isArray(ALLOWED_PARENT_ORIGINS)) return false;
          for (var i = 0; i < ALLOWED_PARENT_ORIGINS.length; i++) {
            if (ALLOWED_PARENT_ORIGINS[i] === origin) return true;
          }
          return false;
        }

        var DATA_REQUEST_TYPE = "atrium-artifact-data-request";
        var DATA_RESPONSE_TYPE = "atrium-artifact-data-response";
        var DATA_REQUEST_TIMEOUT_MS = 10000;
        // A query is an MCP round trip to a Lambda + RDS, which the server
        // action budgets 30s for -- but that clock starts only once the action
        // has authorized the request and opened the connector. This clock
        // starts now, so it must be longer than the server's, or the server's
        // eventual answer arrives after the pending entry is gone and the page
        // retries a query that is still running.
        var QUERY_REQUEST_TIMEOUT_MS = 45000;
        var MAX_PENDING_DATA_REQUESTS = 32;
        var pendingDataRequests = new Map();
        // Capture the primitives before artifact scripts can replace globals.
        var parentWindow = window.parent;
        var postToParent = parentWindow.postMessage.bind(parentWindow);
        var createRequestId =
          window.crypto && typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID.bind(window.crypto)
            : null;
        var scheduleTimeout = window.setTimeout.bind(window);
        var cancelTimeout = window.clearTimeout.bind(window);
        // The synthetic lifecycle events (#1785) are dispatched AFTER artifact
        // code has run, so capture their primitives here too: an artifact that
        // assigns window.Event or its own document.dispatchEvent would otherwise
        // make the dispatch throw and strand the rest of the chain.
        var EventCtor = window.Event;
        var dispatchOnDocument = document.dispatchEvent.bind(document);
        var dispatchOnWindow = window.dispatchEvent.bind(window);
        // Likewise for what the script chain calls when it resumes after an
        // external script: by then artifact code has run and could have
        // replaced document.createElement or Node.prototype.replaceChild.
        var createElement = document.createElement.bind(document);
        var replaceChild = Node.prototype.replaceChild;
        var now = Date.now.bind(Date);
        var logError = window.console.error.bind(window.console);

        /**
         * #1787: the closed set of failure codes the parent may attach to a
         * rejected data response. Anything else (an older parent, a corrupted
         * message) degrades to "unavailable" rather than reaching artifact code
         * as an unvalidated string it might branch on.
         */
        var BRIDGE_ERROR_CODES = [
          "unauthenticated",
          "forbidden",
          "not_query_mode",
          "rate_limited",
          "timeout",
          "query_error",
          "too_many_requests",
          "unavailable",
        ];

        function normalizeBridgeCode(code) {
          return BRIDGE_ERROR_CODES.indexOf(code) === -1 ? "unavailable" : code;
        }

        /**
         * Build the Error an `AtriumData` call rejects with. `err.code` is the
         * typed reason (see BRIDGE_ERROR_CODES) and `err.retryAfterSeconds` is
         * present for `rate_limited` — so an artifact can render "your session
         * expired" for `unauthenticated` and show the message for `query_error`,
         * instead of guessing from one string the way it had to before.
         */
        function bridgeError(code, message, retryAfterSeconds) {
          var normalized = normalizeBridgeCode(code);
          var err = new Error(
            typeof message === "string" && message
              ? message
              : "Atrium data request failed"
          );
          err.code = normalized;
          if (
            normalized === "rate_limited" &&
            typeof retryAfterSeconds === "number" &&
            isFinite(retryAfterSeconds) &&
            retryAfterSeconds >= 0
          ) {
            err.retryAfterSeconds = retryAfterSeconds;
          }
          return err;
        }

        function handleDataResponse(event) {
          // Match the exact parent WindowProxy rather than trusting any window
          // that happens to share the parent's origin. The parent bridge applies
          // the reciprocal check against this frame's contentWindow.
          if (event.source !== parentWindow) return;
          var data = event.data;
          if (
            !data ||
            data.type !== DATA_RESPONSE_TYPE ||
            typeof data.requestId !== "string" ||
            typeof data.ok !== "boolean"
          ) {
            return;
          }

          var pending = pendingDataRequests.get(data.requestId);
          if (!pending) return;

          pendingDataRequests.delete(data.requestId);
          cancelTimeout(pending.timeoutId);
          if (data.ok) {
            pending.resolve(data.data);
          } else {
            pending.reject(
              bridgeError(data.code, data.error, data.retryAfterSeconds)
            );
          }
        }

        // Install exactly one response listener. Unknown, late, spoofed-source,
        // and non-data messages are ignored without disturbing pending calls.
        window.addEventListener("message", handleDataResponse);

        /**
         * Forward the artifact's own uncaught errors and unhandled promise
         * rejections to the parent (#1787).
         *
         * A `ReferenceError` in an artifact's bootstrap is the single most common
         * authoring failure, and until now it existed only in a browser console
         * nobody had open — not the viewer, not the author, and least of all the
         * chat model that wrote the code and then reported success.
         *
         * Safe by construction: the post is PARENT-BOUND (`window.parent`, never
         * an arbitrary window), it carries only a string the artifact's own code
         * produced, and the parent authenticates the sender by WindowProxy
         * identity before it reads anything. Bounded here as well as in the
         * parent so a loop of failing frames cannot flood the channel.
         */
        var MAX_FORWARDED_FRAME_ERRORS = 20;
        var MAX_FORWARDED_ERROR_LENGTH = 500;
        var forwardedFrameErrors = 0;

        function reportFrameError(message, dataFailure) {
          if (forwardedFrameErrors >= MAX_FORWARDED_FRAME_ERRORS) return;
          var text = typeof message === "string" ? message : String(message);
          if (!text) return;
          forwardedFrameErrors += 1;
          var report = {
            type: "atrium-artifact-error",
            message: text.slice(0, MAX_FORWARDED_ERROR_LENGTH),
          };
          if (dataFailure) {
            report.kind = "data";
            report.code = dataFailure.code;
            if (typeof dataFailure.sql === "string") {
              report.sql = dataFailure.sql.slice(0, MAX_FORWARDED_ERROR_LENGTH);
            }
          }
          try {
            postToParent(report, "*");
          } catch (_err) {
            // The parent is gone or refused the post; nothing else to do.
          }
        }

        /**
         * A bridge failure raised HERE rather than answered by the parent — the
         * local timeout, the pending-request cap, a missing id generator. The
         * parent never learns of these on its own (a timed-out request may even
         * succeed there later), so without this an artifact that catches the
         * rejection, as the guidance tells it to, leaves the next chat turn with
         * no diagnostic at all (#1787). Reported, then returned for rejecting.
         */
        function localBridgeFailure(op, fields, code, message) {
          reportFrameError(message, {
            code: code,
            sql: op === "query" && fields ? fields.sql : undefined,
          });
          return bridgeError(code, message);
        }

        // `addEventListener`, not `window.onerror`: an artifact may assign the
        // property handler itself, and overwriting it would break the artifact's
        // own error handling to install ours.
        window.addEventListener("error", function (event) {
          // A failed subresource (a blocked CDN script) fires a non-ErrorEvent on
          // the element; `event.message` is absent there, and those already
          // surface as the script chain's `error` advance.
          if (!event || typeof event.message !== "string") return;
          reportFrameError(event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          reportFrameError(
            reason && reason.message ? reason.message : String(reason)
          );
        });

        function requestData(op, namespace, fields) {
          if (!createRequestId) {
            return Promise.reject(
              localBridgeFailure(op, fields, "unavailable", "Atrium data bridge is unavailable")
            );
          }
          if (pendingDataRequests.size >= MAX_PENDING_DATA_REQUESTS) {
            return Promise.reject(
              localBridgeFailure(op, fields, "too_many_requests",
                "Atrium data bridge has too many pending requests")
            );
          }

          return new Promise(function (resolve, reject) {
            var requestId;
            try {
              requestId = createRequestId();
            } catch (_err) {
              reject(localBridgeFailure(op, fields, "unavailable", "Atrium data bridge is unavailable"));
              return;
            }
            if (pendingDataRequests.has(requestId)) {
              reject(localBridgeFailure(op, fields, "unavailable", "Atrium data request ID collision"));
              return;
            }
            var timeoutId = scheduleTimeout(
              function () {
                pendingDataRequests.delete(requestId);
                reject(localBridgeFailure(op, fields, "timeout", "Atrium data request timed out"));
              },
              op === "query" ? QUERY_REQUEST_TIMEOUT_MS : DATA_REQUEST_TIMEOUT_MS
            );

            pendingDataRequests.set(requestId, {
              resolve: resolve,
              reject: reject,
              timeoutId: timeoutId,
            });

            var message = {
              type: DATA_REQUEST_TYPE,
              requestId: requestId,
              op: op,
            };
            // `query` addresses no record namespace; the record ops always do.
            if (op !== "query") message.namespace = namespace;
            if (op === "submit") {
              message.payload = fields.payload;
            } else if (op === "query") {
              // Only these three fields ever leave the frame. format/export/
              // reason/tool name are forced by the parent's Server Action, so
              // adding them here would change nothing.
              message.sql = fields.sql;
              if (fields.limit !== undefined) message.limit = fields.limit;
              if (fields.offset !== undefined) message.offset = fields.offset;
            } else {
              if (fields.limit !== undefined) message.limit = fields.limit;
              if (fields.scope !== undefined) message.scope = fields.scope;
            }

            try {
              // The parent is a concrete app origin, but this document is opaque
              // because the iframe intentionally omits allow-same-origin. `*` is
              // therefore required for delivery; the receiver authenticates the
              // sender by WindowProxy identity.
              postToParent(message, "*");
            } catch (_err) {
              pendingDataRequests.delete(requestId);
              cancelTimeout(timeoutId);
              reject(localBridgeFailure(op, fields, "unavailable", "Atrium data bridge is unavailable"));
            }
          });
        }

        window.AtriumData = {
          submit: function (namespace, payload) {
            return requestData("submit", namespace, { payload: payload });
          },
          list: function (namespace, options) {
            options = options || {};
            return requestData("list", namespace, {
              limit: options.limit,
              scope: options.scope,
            });
          },
          /**
           * Viewer-scoped, read-only PSD data query (#1705).
           *
           * Resolves to { columns, rows, totalCount, returnedCount, limit,
           * offset, truncated } where `rows` are tuples in `columns` order.
           *
           * REJECTS with an Error carrying a TYPED `err.code` (#1787), one of:
           *   unauthenticated | forbidden | not_query_mode | rate_limited |
           *   timeout | query_error | too_many_requests | unavailable
           * plus a readable `err.message` (for `query_error` seen by someone who
           * can EDIT the artifact, that is the database's own message, e.g.
           * `column "x" does not exist`), and `err.retryAfterSeconds` for
           * `rate_limited`. Render a no-access state ONLY for `forbidden` /
           * `unauthenticated`; show `err.message` for `query_error`, which means
           * the artifact's own SQL is wrong.
           */
          query: function (sql, options) {
            options = options || {};
            return requestData("query", null, {
              sql: sql,
              limit: options.limit,
              offset: options.offset,
            });
          },
        };

        // Recreate <script> nodes so the browser executes them (innerHTML does
        // not run injected scripts). We recreate the artifact's OWN <script> nodes
        // verbatim, copying every attribute INCLUDING `src` — so external-`src`
        // scripts are recreated too, NOT filtered out here. Their loading is
        // governed solely by the host CSP `script-src`: a CDN must be on the
        // allowlist or the load is blocked. (Inline-only mode = `'unsafe-inline'`
        // with no host expression, which blocks all external `src` loads.) The CSP
        // is the mitigation; this function does not sanitize.
        //
        // ORDERING (#1785). Recreating every script in one synchronous loop ran
        // artifact code out of document order, because of two browser rules:
        //   * a script created by `createElement` that has a `src` is
        //     "force-async" — it runs whenever its download finishes, not where
        //     it sits in the markup;
        //   * a recreated INLINE script runs synchronously the instant it is
        //     inserted — i.e. before any earlier external script has loaded.
        // So `<script src=…/chart.umd.min.js>` followed by an inline
        // `new Chart(...)` threw `ReferenceError: Chart is not defined`, with no
        // error surfaced to the author or the viewer. The chain below recreates
        // ONE script at a time in document order and holds the next one until an
        // external/module script has fired `load` or `error`; `async = false`
        // restores insertion-order execution for the external ones.
        //
        // The host document's own DOMContentLoaded/load fired long before
        // render() runs (it is driven by a `message` handler), so artifacts that
        // bootstrap from those events would never start. After the last script
        // we dispatch them synthetically, exactly once per render.

        /**
         * Executable script types: "", "module", and the WHATWG "JavaScript MIME
         * type" essences. An unknown type never runs and fires nothing.
         */
        var EXECUTABLE_SCRIPT_TYPES = [
          "",
          "module",
          "application/ecmascript",
          "application/javascript",
          "application/x-ecmascript",
          "application/x-javascript",
          "text/ecmascript",
          "text/javascript",
          "text/javascript1.0",
          "text/javascript1.1",
          "text/javascript1.2",
          "text/javascript1.3",
          "text/javascript1.4",
          "text/javascript1.5",
          "text/jscript",
          "text/livescript",
          "text/x-ecmascript",
          "text/x-javascript",
        ];
        // Last-resort release if a browser fires neither `load` nor `error`;
        // without it the chain would stall and the synthetic DOMContentLoaded
        // would never reach the artifact. Generous on purpose: releasing a
        // script that is merely SLOW lets the next one run before it — the very
        // ordering bug this chain exists to prevent — and a network failure
        // fires `error` on its own well before this.
        var SCRIPT_LOAD_TIMEOUT_MS = 60000;
        // Bound on the whole chain's waiting, so an artifact with many slow
        // scripts cannot hold its preview for N × SCRIPT_LOAD_TIMEOUT_MS. Past
        // it, remaining scripts are still inserted (async = false keeps the
        // external ones in order among themselves) but no longer waited on.
        var SCRIPT_CHAIN_DEADLINE_MS = 90000;
        // Only the newest render's chain may keep running: the parent re-posts
        // the artifact code until it is acked, so a second render can land while
        // an earlier chain is still waiting on a CDN.
        var renderGeneration = 0;

        // Lifecycle listeners the ARTIFACT registered (#1785). Abandoning a
        // superseded chain stops it running more scripts, but it cannot
        // unregister what its earlier inline scripts already put on
        // window/document: a stale `DOMContentLoaded`/`load` handler stays
        // live, and the replacement chain's synthetic dispatch then runs it
        // alongside the current one — initializing the artifact twice and
        // repeating side effects such as `AtriumData.submit`. This is the
        // ordinary retry path, not an edge case: the parent re-posts the code
        // until it is acked, so a second render lands whenever the first ack is
        // slow. The same applies across artifacts, where a PREVIOUS artifact's
        // handlers would otherwise see the next one's lifecycle pair.
        //
        // So record every lifecycle registration against the generation that
        // made it, and drop the other generations' when a new chain starts.
        // Best-effort by design: an artifact that replaces
        // `document.addEventListener` outright stops being tracked, and the
        // chain's own dispatch primitives were captured up-front regardless.
        var LIFECYCLE_EVENT_TYPES = ["DOMContentLoaded", "load"];
        var artifactLifecycleListeners = [];

        /** `removeEventListener` matches on the capture flag alone. */
        function captureFlagOf(options) {
          if (options && typeof options === "object") return !!options.capture;
          return !!options;
        }

        /**
         * Shadow `addEventListener` on one target so lifecycle registrations
         * made while a render chain is running are recorded. Registrations from
         * before the first render (the host's own) have generation 0 and are
         * never touched.
         */
        function trackLifecycleListeners(target, add, remove) {
          var wrapped = function (type, listener) {
            if (
              renderGeneration !== 0 &&
              listener &&
              LIFECYCLE_EVENT_TYPES.indexOf(type) !== -1
            ) {
              artifactLifecycleListeners.push({
                generation: renderGeneration,
                remove: remove,
                type: type,
                listener: listener,
                capture: captureFlagOf(arguments[2]),
              });
            }
            return add.apply(null, arguments);
          };
          try {
            Object.defineProperty(target, "addEventListener", {
              value: wrapped,
              writable: true,
              configurable: true,
              enumerable: false,
            });
          } catch (err) {
            // A browser that refuses the shadow keeps the native method; the
            // double-dispatch this prevents is strictly better than a host that
            // fails to load.
            logError("Atrium sandbox: lifecycle listener tracking unavailable:", err);
          }
        }

        trackLifecycleListeners(
          document,
          document.addEventListener.bind(document),
          document.removeEventListener.bind(document)
        );
        trackLifecycleListeners(
          window,
          window.addEventListener.bind(window),
          window.removeEventListener.bind(window)
        );

        /**
         * Unregister the lifecycle listeners that belong to any generation
         * other than the current one, so neither a superseded chain nor a
         * previous artifact can be re-entered by this chain's dispatch.
         */
        function dropStaleLifecycleListeners() {
          var kept = [];
          for (var i = 0; i < artifactLifecycleListeners.length; i++) {
            var entry = artifactLifecycleListeners[i];
            if (entry.generation === renderGeneration) {
              kept.push(entry);
              continue;
            }
            try {
              // Object form, not the boolean shorthand: both are spec-legal in
              // a browser, but some EventTarget implementations only match the
              // capture flag when it arrives as `{ capture }`, and a silently
              // unmatched remove leaves exactly the stale handler this drops.
              entry.remove(entry.type, entry.listener, { capture: entry.capture });
            } catch (err) {
              // An artifact that broke removeEventListener must not stop the
              // new render; the worst case is the stale handler this was meant
              // to drop.
              logError("Atrium sandbox: could not drop a stale lifecycle listener:", err);
            }
          }
          artifactLifecycleListeners = kept;
          // The property-handler form fires on the same synthetic `load` and
          // bypasses addEventListener. The host never sets it, and this runs
          // before the new chain's first script, so any value is stale.
          window.onload = null;
        }

        /**
         * Does the chain have to WAIT for this script, rather than assume it ran
         * on insertion? External classic scripts must be fetched, and module
         * scripts (even inline ones) are always deferred. Both fire load/error.
         * A non-executable type (e.g. `text/template`, `application/json`) fires
         * neither, so waiting on one would just burn the timeout — and so does
         * a classic `nomodule` script, which every module-capable browser skips
         * without fetching it.
         */
        function isDeferredScript(node) {
          var type = (node.getAttribute("type") || "").split(";")[0];
          type = type.replace(/^\s+|\s+$/g, "").toLowerCase();
          if (EXECUTABLE_SCRIPT_TYPES.indexOf(type) === -1) return false;
          if (type === "module") return true;
          if (node.hasAttribute("nomodule")) return false;
          return node.hasAttribute("src");
        }

        function executeScripts(container) {
          var found = container.querySelectorAll("script");
          var nodes = [];
          for (var i = 0; i < found.length; i++) nodes.push(found[i]);

          renderGeneration += 1;
          var generation = renderGeneration;
          // Any chain this one supersedes — and any previous artifact — loses
          // its lifecycle handlers now, before this chain can dispatch to them.
          dropStaleLifecycleListeners();
          var index = 0;
          var deadline = now() + SCRIPT_CHAIN_DEADLINE_MS;

          function finish() {
            // Listener exceptions do not propagate out of dispatchEvent, so a
            // broken artifact bootstrap cannot break the host here. Only THIS
            // generation's handlers are still registered: innerHTML cannot
            // unregister a previous artifact's listeners (any more than it can
            // undo the other globals it set), so dropStaleLifecycleListeners()
            // removed the tracked ones when this chain started.
            dispatchOnDocument(new EventCtor("DOMContentLoaded", { bubbles: true }));
            dispatchOnWindow(new EventCtor("load"));
          }

          // Runs synchronously through consecutive inline scripts (a loop, not
          // recursion, so an artifact with thousands of them cannot overflow the
          // stack) and returns as soon as it has to wait for one.
          function step() {
            for (;;) {
              // A newer render superseded this one — abandon the chain so it
              // neither touches the new artifact's DOM nor fires a second pair
              // of lifecycle events.
              if (generation !== renderGeneration) return;
              if (index >= nodes.length) {
                finish();
                return;
              }

              var old = nodes[index];
              index += 1;

              var s = createElement("script");
              for (var a = 0; a < old.attributes.length; a++) {
                s.setAttribute(old.attributes[a].name, old.attributes[a].value);
              }
              s.textContent = old.textContent;
              // Clears BOTH the force-async flag and any author `async`
              // attribute: document order is what the artifact's code assumes.
              s.async = false;

              // Skip a script that is no longer in the document: an earlier
              // recreated script that runs synchronously could remove it — or
              // an ancestor of it — before the chain reaches it (the node list
              // was captured before any script ran). A detached script never
              // runs and never fires load/error, so waiting on one would burn
              // the timeout, and a removed one has no parent to replace it in.
              if (!old.isConnected) continue;

              var remainingMs = deadline - now();
              if (!isDeferredScript(old) || remainingMs <= 0) {
                // Runs synchronously on insertion (or the chain is out of
                // waiting time); carry straight on.
                replaceChild.call(old.parentNode, s, old);
                continue;
              }

              wireAndInsert(s, old, Math.min(SCRIPT_LOAD_TIMEOUT_MS, remainingMs));
              return;
            }
          }

          /** Insert a script the chain must wait for, and resume on its result. */
          function wireAndInsert(s, old, waitMs) {
            var advanced = false;
            var timeoutId = null;
            var advance = function () {
              if (advanced) return;
              advanced = true;
              if (timeoutId !== null) cancelTimeout(timeoutId);
              // This resumes from a load/error/timer callback, outside the
              // message handler's try/catch, and the render was already acked.
              // A throw here (e.g. an artifact broke a DOM method the chain
              // uses) would otherwise escape as an uncaught error; stop the
              // chain and say why instead.
              try {
                step();
              } catch (err) {
                logError("Atrium sandbox: artifact script chain stopped:", err);
              }
            };
            s.addEventListener("load", advance);
            // A CSP-blocked, 404'd or empty-`src` script fires `error`. The rest
            // of the artifact still runs — one dead CDN must not blank the page.
            s.addEventListener("error", advance);
            // Set before insertion: the listeners cannot fire until the node is
            // connected, so timeoutId is always assigned by then.
            timeoutId = scheduleTimeout(advance, waitMs);
            replaceChild.call(old.parentNode, s, old);
          }

          step();
        }

        function render(code) {
          // Replace the entire root subtree with the artifact markup, then start
          // the ordered script chain. The CSP confines what those scripts can
          // reach; the cross-origin + sandbox confinement does the rest.
          //
          // executeScripts() STARTS the chain and returns; it does not wait for
          // external scripts. The ack below therefore still goes out
          // immediately, which is required: the parent re-posts the code on an
          // interval until it is acked, so deferring the ack until a CDN
          // answered would make it re-render the artifact from scratch.
          //
          // CodeQL flags the innerHTML assignment below as client-side XSS. This
          // is the INTENTIONAL untrusted-execution sink — rendering untrusted
          // artifact code is the entire purpose of this isolated host page, and it
          // is contained by four independent layers (see the file header):
          //   1. served from a SEPARATE origin (no app cookies/storage in scope);
          //   2. embedded only via <iframe sandbox="allow-scripts"> with NO
          //      allow-same-origin, so the document runs in an opaque origin;
          //   3. a strict CSP (default-src 'none'; connect-src 'none'; …) blocks
          //      network exfiltration and first-party API calls;
          //   4. render() runs only after isAllowedOrigin(event.origin) passes.
          // There is no "sanitized" alternative that preserves the feature.
          // Sanitizing here would break legitimate artifacts; the sandbox IS the
          // mitigation. CodeQL cannot model the iframe-sandbox boundary, so this
          // is a justified, reviewer-dismissable false positive.
          root.innerHTML = typeof code === "string" ? code : "";
          executeScripts(root);
        }

        // The code of the last render that started without throwing. The parent
        // re-posts the SAME code until it sees an ack (immediately, again when
        // the frame's load fires, then on an interval), so duplicates routinely
        // land while the first render is still waiting on a CDN. Re-rendering
        // for one would tear down a live chain whose already-inserted external
        // script still executes later, into the replacement render — work that
        // no in-document mechanism can take back. A duplicate is therefore
        // acked without touching the render at all. (Genuinely NEW code is
        // still rendered over the old; the app gives each artifact version a
        // fresh frame, so that path is best-effort by design.)
        var currentRenderCode = null;

        window.addEventListener("message", function (event) {
          // Reject any message from an origin not on the build-time allowlist.
          if (!isAllowedOrigin(event.origin)) return;
          var data = event.data;
          if (!data || data.type !== "atrium-render") return;
          try {
            var code = typeof data.code === "string" ? data.code : "";
            if (code !== currentRenderCode) {
              // Cleared first so a render that throws is retried by the next
              // post rather than acked as a duplicate.
              currentRenderCode = null;
              render(code);
              currentRenderCode = code;
            }
            // Acknowledge back to the (validated) parent so the app can surface
            // load state. We do NOT send any artifact data back.
            event.source &&
              event.source.postMessage(
                { type: "atrium-artifact-rendered", ok: true },
                event.origin
              );
          } catch (err) {
            event.source &&
              event.source.postMessage(
                {
                  type: "atrium-artifact-rendered",
                  ok: false,
                  error: String((err && err.message) || err),
                },
                event.origin
              );
          }
        });
      })();
    </script>
  </body>
</html>
