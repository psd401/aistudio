<!doctype html>
<!--
  Atrium artifact sandbox host page (#1052, Epic #1059, Phase 2, spec §19.2 / §28.1)

  Served from the DEDICATED sandbox origin (ATRIUM_SANDBOX_ORIGIN) — a distinct
  CloudFront distribution / subdomain that shares NO cookies or storage with the
  AI Studio app origin. The app embeds this page in an
  <iframe sandbox="allow-scripts"> (NO allow-same-origin) and posts the untrusted
  artifact code to it via postMessage AFTER load.

  Containment layers (defense in depth):
   1. Cross-origin: this page is never same-origin with the app, so even if the
      sandbox attributes were bypassed it could not read app cookies/storage.
   2. iframe sandbox without allow-same-origin: the framed document runs in an
      opaque origin — it cannot read THIS origin's cookies/storage either, and
      cannot reach the app origin.
   3. CSP: CloudFront serves this page with a strict Content-Security-Policy
      (default-src 'none'; connect-src 'none'; ...), so artifact code cannot call
      first-party APIs or exfiltrate over the network except to explicitly
      allowlisted CDNs. The <meta> CSP below is a same-value fallback for local
      preview; the authoritative CSP is the response header.
   4. Parent-origin allowlist: this page only accepts a render message whose
      event.origin is in the build-time ALLOWED_PARENT_ORIGINS list, so a random
      site cannot frame it and inject code (it would also be blocked by the host
      CSP `frame-ancestors`, but we check defensively).

  The injected artifact may include inline <script> tags; setting innerHTML does
  not execute them, so we recreate each <script> node (allowed by the host CSP's
  script-src 'unsafe-inline'). We render only ONE message (the first valid one
  is replaced on each subsequent valid message) and never eval arbitrary strings
  ourselves beyond reconstructing the author's own script nodes.

  Before any artifact code runs, this host installs window.AtriumData. The helper
  uses postMessage to ask the authenticated parent for scoped data operations;
  it does not weaken the frame CSP or give artifact code direct network access.

  AtriumData exposes three operations, and which ones an artifact may actually
  use is decided by the PARENT from the object's stored data_access mode, never
  here: submit/list (the artifact record store) and query (#1705, viewer-scoped
  read-only PSD data). `query` runs as the person VIEWING the page — this frame
  never sees a token, only SQL in and rows out — and it is mutually exclusive
  with submit/list so a page can never read district data and then write it into
  a store its author can read back.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Fallback CSP for environments that don't set the response header (e.g. local
      file preview). CloudFront sets the authoritative, identical policy as a
      response header in production. The CSP token in the meta below is
      substituted at deploy time by the CDK stack.
    -->
    <meta http-equiv="Content-Security-Policy" content="__CSP_POLICY__" />
    <title>Artifact</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; }
      #atrium-artifact-root { padding: 0; }
      #atrium-artifact-empty {
        display: flex; align-items: center; justify-content: center;
        min-height: 200px; color: #9ca3af; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="atrium-artifact-root">
      <div id="atrium-artifact-empty">Waiting for artifact…</div>
    </div>
    <script>
      (function () {
        "use strict";

        // Build-time substitution: the JSON array of app origins allowed to post
        // render messages to this host. The CDK stack replaces this token.
        var ALLOWED_PARENT_ORIGINS = __ALLOWED_PARENT_ORIGINS__;

        var root = document.getElementById("atrium-artifact-root");

        function isAllowedOrigin(origin) {
          if (!Array.isArray(ALLOWED_PARENT_ORIGINS)) return false;
          for (var i = 0; i < ALLOWED_PARENT_ORIGINS.length; i++) {
            if (ALLOWED_PARENT_ORIGINS[i] === origin) return true;
          }
          return false;
        }

        var DATA_REQUEST_TYPE = "atrium-artifact-data-request";
        var DATA_RESPONSE_TYPE = "atrium-artifact-data-response";
        var DATA_REQUEST_TIMEOUT_MS = 10000;
        // A query is an MCP round trip to a Lambda + RDS, which the parent's
        // connector path already budgets 30s for. Using the record timeout here
        // would abandon legitimate aggregates while the server still answers.
        var QUERY_REQUEST_TIMEOUT_MS = 30000;
        var MAX_PENDING_DATA_REQUESTS = 32;
        var pendingDataRequests = new Map();
        // Capture the primitives before artifact scripts can replace globals.
        var parentWindow = window.parent;
        var postToParent = parentWindow.postMessage.bind(parentWindow);
        var createRequestId =
          window.crypto && typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID.bind(window.crypto)
            : null;
        var scheduleTimeout = window.setTimeout.bind(window);
        var cancelTimeout = window.clearTimeout.bind(window);

        function handleDataResponse(event) {
          // Match the exact parent WindowProxy rather than trusting any window
          // that happens to share the parent's origin. The parent bridge applies
          // the reciprocal check against this frame's contentWindow.
          if (event.source !== parentWindow) return;
          var data = event.data;
          if (
            !data ||
            data.type !== DATA_RESPONSE_TYPE ||
            typeof data.requestId !== "string" ||
            typeof data.ok !== "boolean"
          ) {
            return;
          }

          var pending = pendingDataRequests.get(data.requestId);
          if (!pending) return;

          pendingDataRequests.delete(data.requestId);
          cancelTimeout(pending.timeoutId);
          if (data.ok) {
            pending.resolve(data.data);
          } else {
            pending.reject(
              new Error(
                typeof data.error === "string" && data.error
                  ? data.error
                  : "Atrium data bridge is unavailable"
              )
            );
          }
        }

        // Install exactly one response listener. Unknown, late, spoofed-source,
        // and non-data messages are ignored without disturbing pending calls.
        window.addEventListener("message", handleDataResponse);

        function requestData(op, namespace, fields) {
          if (!createRequestId) {
            return Promise.reject(
              new Error("Atrium data bridge is unavailable")
            );
          }
          if (pendingDataRequests.size >= MAX_PENDING_DATA_REQUESTS) {
            return Promise.reject(
              new Error("Atrium data bridge has too many pending requests")
            );
          }

          return new Promise(function (resolve, reject) {
            var requestId;
            try {
              requestId = createRequestId();
            } catch (_err) {
              reject(new Error("Atrium data bridge is unavailable"));
              return;
            }
            if (pendingDataRequests.has(requestId)) {
              reject(new Error("Atrium data request ID collision"));
              return;
            }
            var timeoutId = scheduleTimeout(
              function () {
                pendingDataRequests.delete(requestId);
                reject(new Error("Atrium data request timed out"));
              },
              op === "query" ? QUERY_REQUEST_TIMEOUT_MS : DATA_REQUEST_TIMEOUT_MS
            );

            pendingDataRequests.set(requestId, {
              resolve: resolve,
              reject: reject,
              timeoutId: timeoutId,
            });

            var message = {
              type: DATA_REQUEST_TYPE,
              requestId: requestId,
              op: op,
            };
            // `query` addresses no record namespace; the record ops always do.
            if (op !== "query") message.namespace = namespace;
            if (op === "submit") {
              message.payload = fields.payload;
            } else if (op === "query") {
              // Only these three fields ever leave the frame. format/export/
              // reason/tool name are forced by the parent's Server Action, so
              // adding them here would change nothing.
              message.sql = fields.sql;
              if (fields.limit !== undefined) message.limit = fields.limit;
              if (fields.offset !== undefined) message.offset = fields.offset;
            } else {
              if (fields.limit !== undefined) message.limit = fields.limit;
              if (fields.scope !== undefined) message.scope = fields.scope;
            }

            try {
              // The parent is a concrete app origin, but this document is opaque
              // because the iframe intentionally omits allow-same-origin. `*` is
              // therefore required for delivery; the receiver authenticates the
              // sender by WindowProxy identity.
              postToParent(message, "*");
            } catch (_err) {
              pendingDataRequests.delete(requestId);
              cancelTimeout(timeoutId);
              reject(new Error("Atrium data bridge is unavailable"));
            }
          });
        }

        window.AtriumData = {
          submit: function (namespace, payload) {
            return requestData("submit", namespace, { payload: payload });
          },
          list: function (namespace, options) {
            options = options || {};
            return requestData("list", namespace, {
              limit: options.limit,
              scope: options.scope,
            });
          },
          /**
           * Viewer-scoped, read-only PSD data query (#1705).
           *
           * Resolves to { columns, rows, totalCount, returnedCount, limit,
           * offset, truncated } where `rows` are tuples in `columns` order.
           * REJECTS (with the same generic bridge error as every other failure)
           * when the artifact is not in `query` mode, the viewer lacks access to
           * the data server, the session has no live ID token, or the rate limit
           * is exhausted — so pages must render a sign-in / no-access state
           * rather than assuming a result.
           */
          query: function (sql, options) {
            options = options || {};
            return requestData("query", null, {
              sql: sql,
              limit: options.limit,
              offset: options.offset,
            });
          },
        };

        // Recreate <script> nodes so the browser executes them (innerHTML does
        // not run injected scripts). We recreate the artifact's OWN <script> nodes
        // verbatim, copying every attribute INCLUDING `src` — so external-`src`
        // scripts are recreated too, NOT filtered out here. Their loading is
        // governed solely by the host CSP `script-src`: a CDN must be on the
        // allowlist or the load is blocked. (Inline-only mode = `'unsafe-inline'`
        // with no host expression, which blocks all external `src` loads.) The CSP
        // is the mitigation; this function does not sanitize.
        function executeScripts(container) {
          var scripts = container.querySelectorAll("script");
          for (var i = 0; i < scripts.length; i++) {
            var old = scripts[i];
            var s = document.createElement("script");
            for (var a = 0; a < old.attributes.length; a++) {
              s.setAttribute(old.attributes[a].name, old.attributes[a].value);
            }
            s.textContent = old.textContent;
            // Guard against a null parent: an earlier recreated script that runs
            // synchronously could remove a later sibling from the DOM before this
            // loop reaches it (the NodeList was captured before any script ran).
            // Without this guard, `null.replaceChild` would throw, the catch in
            // the message handler would ack { ok:false }, and the preview would
            // sit blank with no surfaced error.
            if (old.parentNode) old.parentNode.replaceChild(s, old);
          }
        }

        function render(code) {
          // Replace the entire root subtree with the artifact markup, then
          // execute any inline scripts. The CSP confines what those scripts can
          // reach; the cross-origin + sandbox confinement does the rest.
          //
          // CodeQL flags the innerHTML assignment below as client-side XSS. This
          // is the INTENTIONAL untrusted-execution sink — rendering untrusted
          // artifact code is the entire purpose of this isolated host page, and it
          // is contained by four independent layers (see the file header):
          //   1. served from a SEPARATE origin (no app cookies/storage in scope);
          //   2. embedded only via <iframe sandbox="allow-scripts"> with NO
          //      allow-same-origin, so the document runs in an opaque origin;
          //   3. a strict CSP (default-src 'none'; connect-src 'none'; …) blocks
          //      network exfiltration and first-party API calls;
          //   4. render() runs only after isAllowedOrigin(event.origin) passes.
          // There is no "sanitized" alternative that preserves the feature.
          // Sanitizing here would break legitimate artifacts; the sandbox IS the
          // mitigation. CodeQL cannot model the iframe-sandbox boundary, so this
          // is a justified, reviewer-dismissable false positive.
          root.innerHTML = typeof code === "string" ? code : "";
          executeScripts(root);
        }

        window.addEventListener("message", function (event) {
          // Reject any message from an origin not on the build-time allowlist.
          if (!isAllowedOrigin(event.origin)) return;
          var data = event.data;
          if (!data || data.type !== "atrium-render") return;
          try {
            render(data.code);
            // Acknowledge back to the (validated) parent so the app can surface
            // load state. We do NOT send any artifact data back.
            event.source &&
              event.source.postMessage(
                { type: "atrium-artifact-rendered", ok: true },
                event.origin
              );
          } catch (err) {
            event.source &&
              event.source.postMessage(
                {
                  type: "atrium-artifact-rendered",
                  ok: false,
                  error: String((err && err.message) || err),
                },
                event.origin
              );
          }
        });
      })();
    </script>
  </body>
</html>
