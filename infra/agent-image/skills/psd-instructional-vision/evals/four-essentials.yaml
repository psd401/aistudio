id: instructional-vision-four-essentials
skill: psd-instructional-vision
level: L1
workspace: pure
suite: regression
prompt: "Using PSD's instructional vision, name the four Instructional Essentials and cite where they come from."
trials: 3
graders:
  # The point of this skill is that it retrieves rather than recalls. These two
  # graders are the regression that matters: the framework text is no longer
  # bundled, so an answer produced without these calls came from model memory —
  # exactly the stale-content failure the skill now exists to prevent.
  - {"type":"broker_request","route":"/api/agent/aistudio","method":"POST","body":{"method":{"exact":"tools/call"},"params.name":{"exact":"repositories_list"}}}
  - {"type":"broker_request","route":"/api/agent/aistudio","method":"POST","body":{"method":{"exact":"tools/call"},"params.name":{"exact":"repositories_search"}}}
  # Structural assertions only. Deliberately NOT asserting the individual
  # essential names or the "eight Tier 1 practices" count: Teaching & Learning
  # revises them (the Playbook is on V2 as of 2026-08-03), and pinning last
  # year's wording here would reintroduce the staleness this change removed.
  # The count of focus areas and the presence of a citation are the stable
  # contract; the wording lives in the repository.
  - {"type":"output_match","pattern":"(?:four|4)","ignore_case":true}
  - {"type":"output_match","pattern":"instructional essentials","ignore_case":true}
