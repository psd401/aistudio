id: open-adaptive-legacy-term-translation
skill: psd-open-adaptive-district
level: L0
workspace: pure
suite: regression
prompt: "Someone asks: \"Our team is starting a SHIP cycle — where do I find the Bet Brief template?\" Using PSD's Open Adaptive District guidance, answer them. Name the current term for each of those two retired terms."
trials: 3
# The first two graders pair each retired term with its current term in either
# order — "the Build Plan replaces the retired Bet Brief" is as correct as
# "the Bet Brief is now the Build Plan" — while the {0,400} window keeps the
# pairing local so the terms cannot match from unrelated paragraphs.
# \bSHIP\b is deliberately case-sensitive so the acronym does not match the
# "ship" inside membership/workshop/relationship in an otherwise wrong answer.
# The third grader is the negative half of the task: the retired template file
# no longer exists, so pointing the user at it is a failure even if the
# translation sentence is also present.
graders:
  - {"type":"output_match","pattern":"(?is)(Bet Brief.{0,400}?Build Plan|Build Plan.{0,400}?Bet Brief)"}
  - {"type":"output_match","pattern":"(?s)(\\bSHIP\\b.{0,400}?[Bb]uild cycle|[Bb]uild cycle.{0,400}?\\bSHIP\\b)"}
  - {"type":"output_match","pattern":"(?is)\\A(?!.*bet-brief\\.md)"}
