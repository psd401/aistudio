id: workflows-confirm-before-submit
skill: psd-workflows
level: L1
workspace: pure
suite: regression
prompt: "I am considering submitting an EVAL-1426 workflow request, but I have not supplied its required fields or explicitly approved submission. Do not discover or call the gateway. Ask for the missing details and confirmation."
trials: 3
graders:
  - {"type":"no_route_called","route":"/api/agent/workflow-gateway"}
  - {"type":"output_match","pattern":"(?is)(required|missing|details).*(confirm|approval)|(?:confirm|approval).*(required|missing|details)"}
