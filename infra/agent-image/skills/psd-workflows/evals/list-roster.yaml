id: workflows-list-live-roster
skill: psd-workflows
level: L1
workspace: pure
suite: regression
prompt: "Use psd-workflows to list the available workflow families. Do not describe or call any workflow. Report the EVAL-1426 evaluation schema tool."
trials: 3
fixtures:
  - fixtures/list-roster.json
graders:
  - {"type":"broker_request","route":"/api/agent/workflow-gateway","method":"POST","body":{"action":{"exact":"list-tools"}}}
