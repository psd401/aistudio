id: tts-synthetic-short-audio
skill: psd-tts
level: L2
workspace: mutating
suite: capability
prompt: "Use psd-tts to synthesize exactly this clearly marked test sentence with the default voice: \"EVAL 1426 synthetic audio canary.\" Return the bare link and do not add any other source content."
trials: 3
graders:
  - {"type":"tool_call_succeeded","tool":"exec","args_pattern":"psd-tts/scripts/synthesize\\.py"}
  # #2034: private by default, so the link is a Drive file shared with the
  # requester, never a public S3 object.
  - {"type":"output_match","pattern":"https://drive\\.google\\.com/file/d/[^\\s`)\\]/]+/view"}
  - {"type":"output_match","pattern":"(?i)^(?![\\s\\S]*public-images)[\\s\\S]*$"}
